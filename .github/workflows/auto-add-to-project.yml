name: Auto-add issues to All Issues Project

on:
  issues:
    types: [opened, reopened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          gh api graphql -f query='
            mutation {
              addProjectV2ItemById(input: { projectId: "PVT_kwHOB-QsR84BbD4z", contentId: "${{ github.event.issue.node_id }}" }) {
                item { id }
              }
            }'
